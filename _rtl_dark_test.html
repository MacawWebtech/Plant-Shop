<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dark-mode.css"></head><body><p class="text-muted" id="p">Test paragraph</p><div class="product-card"><div class="quick-actions"><a class="btn btn-light" id="q" href="#">Quick View</a></div></div><script>document.documentElement.setAttribute('data-theme','dark'); const p=document.getElementById('p'),q=document.getElementById('q'); document.body.insertAdjacentHTML('beforeend','<pre id="out"></pre>'); const s1=getComputedStyle(p).color; const s2=getComputedStyle(q).color; q.dispatchEvent(new MouseEvent('mouseover',{bubbles:true})); document.getElementById('out').textContent='paragraph='+s1+'; quickview='+s2;</script></body></html>
